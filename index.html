<script>
  const supabaseUrl = "https://pkzwwhaqnpxmzqwzcitl.supabase.co";
  const supabaseAnonKey = "sb_publishable_UPhipxgZU5lbyY3gAECheQ_xk1kdLjp";
  const sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const statusEl = document.getElementById("status");
  const setStatus = (msg) => { statusEl.textContent = msg || ""; };

  const pad = (n) => String(n).padStart(2, "0");

  const fmt = (secs) => {
    secs = Math.max(0, Math.floor(secs || 0));
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  };

  const LONDON_TZ = "Europe/London";

  const londonDateKey = (tsMs) => {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: LONDON_TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date(tsMs));

    const get = (type) => parts.find(p => p.type === type).value;
    return `${get("year")}-${get("month")}-${get("day")}`;
  };

  const todayKey = () => londonDateKey(Date.now());
  const dateKeyForTs = (tsMs) => londonDateKey(tsMs);
  const parseDateKey = (d) => String(d).slice(0, 10);

  function minutesToSeconds(mins) {
    const n = Number(String(mins).replace(",", "."));
    if (!Number.isFinite(n) || n < 0) return null;
    return Math.round(n * 60);
  }

  let currentUserId = null;
  let items = [];
  let sessions = [];
  let running = null;
  let historySelectedDate = null;

  const authBox = document.getElementById("authBox");
  const emailInput = document.getElementById("email");
  const otpInput = document.getElementById("otp");
  const sendCodeBtn = document.getElementById("sendCodeBtn");
  const verifyBtn = document.getElementById("verifyBtn");
  const signOutBtn = document.getElementById("signOutBtn");

  function showAuthBox(show) {
    authBox.style.display = show ? "block" : "none";
  }

  sendCodeBtn.onclick = async () => {
    const email = emailInput.value.trim();
    if (!email) return alert("Enter email");

    setStatus("Sending code...");
    const { error } = await sb.auth.signInWithOtp({ email });
    if (error) return alert(error.message);
    setStatus("Code sent");
  };

  verifyBtn.onclick = async () => {
    const email = emailInput.value.trim();
    const token = otpInput.value.trim();
    if (!email || !token) return alert("Enter email + code");

    const { error } = await sb.auth.verifyOtp({
      email,
      token,
      type: "email"
    });

    if (error) return alert(error.message);

    await bootstrap();
  };

  signOutBtn.onclick = async () => {
    await sb.auth.signOut();
    currentUserId = null;
    items = [];
    sessions = [];
    running = null;
    showAuthBox(true);
    render();
  };

  async function loadFromCloud() {
    console.log("loadFromCloud called");
    console.log("currentUserId:", currentUserId);

    if (!currentUserId) return;

    setStatus("Loading...");

    const { data: itemsData, error: itemsErr } = await sb
      .from("practice_items")
      .select("*")
      .eq("user_id", currentUserId)
      .order("created_at", { ascending: true });

    if (itemsErr) {
      console.error(itemsErr);
      setStatus("Load error");
      return;
    }

    items = (itemsData || []).map(r => ({
      id: r.id,
      name: r.name,
      archived: r.archived,
      createdAt: new Date(r.created_at).getTime()
    }));

    const { data: sessionsData, error: sessionsErr } = await sb
      .from("practice_sessions")
      .select("*")
      .eq("user_id", currentUserId);

    if (sessionsErr) {
      console.error(sessionsErr);
      setStatus("Load error");
      return;
    }

    sessions = (sessionsData || []).map(r => ({
      id: r.id,
      itemId: r.item_id,
      startTs: new Date(r.start_time).getTime(),
      endTs: new Date(r.end_time).getTime(),
      durationSec: r.duration_seconds,
      dateKey: parseDateKey(r.date_key)
    }));

    console.log("Loaded sessions:", sessions);
    setStatus("");
  }

  async function saveSessionToCloud(itemId, startTs, endTs, durationSec, dateKey) {
    const { data, error } = await sb
      .from("practice_sessions")
      .insert({
        user_id: currentUserId,
        item_id: itemId,
        start_time: new Date(startTs).toISOString(),
        end_time: new Date(endTs).toISOString(),
        duration_seconds: durationSec,
        date_key: dateKey
      })
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Save failed");
      return;
    }

    sessions.push({
      id: data.id,
      itemId: data.item_id,
      startTs: new Date(data.start_time).getTime(),
      endTs: new Date(data.end_time).getTime(),
      durationSec: data.duration_seconds,
      dateKey: parseDateKey(data.date_key)
    });
  }

  async function addItemToCloud(name) {
    const { data, error } = await sb
      .from("practice_items")
      .insert({ user_id: currentUserId, name, archived: false })
      .select()
      .single();

    if (error) return console.error(error);

    items.push({
      id: data.id,
      name: data.name,
      archived: data.archived,
      createdAt: new Date(data.created_at).getTime()
    });
  }

  function render() {
    const isHistory = location.hash === "#history";
    const isTotals = location.hash === "#totals";
    const isHome = !isHistory && !isTotals;

    document.getElementById("items").style.display = isHome ? "block" : "none";
    document.getElementById("todayTotal").style.display = isHome ? "block" : "none";

    if (isHome) renderHome();
  }

  function renderHome() {
    const wrap = document.getElementById("items");
    wrap.innerHTML = "";

    for (const it of items) {
      const row = document.createElement("div");
      row.textContent = it.name;
      row.onclick = async () => {
        const start = Date.now();
        const end = Date.now();
        await saveSessionToCloud(it.id, start, end, 60, todayKey());
      };
      wrap.appendChild(row);
    }
  }

  // 🔥 FIXED BOOTSTRAP (MAIN FIX)
  async function bootstrap() {
    const { data: { session } } = await sb.auth.getSession();
    currentUserId = session?.user?.id ?? null;

    if (!currentUserId) {
      showAuthBox(true);
      render();
      return;
    }

    showAuthBox(false);
    await loadFromCloud();
    render();
  }

  // 🔥 AUTH LISTENER FIX
  sb.auth.onAuthStateChange((_event, session) => {
    currentUserId = session?.user?.id ?? null;

    if (currentUserId) {
      loadFromCloud();
      render();
    }
  });

  window.addEventListener("hashchange", render);

  bootstrap();
</script>
