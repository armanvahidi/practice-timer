<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Timer</title>
  <style>
    body { font-family: -apple-system, system-ui, Arial; margin: 16px; }
    h1 { margin: 0 0 8px 0; font-size: 22px; }
    .total { font-size: 28px; margin: 8px 0 16px 0; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 10px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px;
    }
    .name { font-size: 18px; cursor: pointer; user-select: none; }
    .time { font-variant-numeric: tabular-nums; opacity: 0.8; }
    .running { border-color: #000; }
    .controls { display:flex; gap:8px; margin: 12px 0; flex-wrap: wrap; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor:pointer; }
    input { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; width: 100%; }
    input, textarea, select { font-size: 16px; }
    a { display:inline-block; margin-top: 12px; }
    #authBox { margin: 12px 0; padding: 12px; border: 1px solid #ddd; border-radius: 10px; display:none; }
    #authRow { display:flex; gap:8px; margin-top: 8px; flex-wrap: wrap; }
    #status { margin: 10px 0; opacity: 0.85; }
    .rightWrap { display:flex; align-items:center; gap:8px; flex-wrap: wrap; }
    .controls > * { flex: 1 1 180px; }
    .controls button { flex: 0 0 auto; }
    .navLinks { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
    .subtle { opacity: 0.75; font-size: 14px; margin-top: 4px; }
  </style>
</head>

<body>
  <h1>2026 Timer</h1>

  <div id="status"></div>

  <div id="authBox">
    <div>
      <input id="email" placeholder="Email for login" autocomplete="email" />
    </div>
    <div id="authRow">
      <button id="sendCodeBtn" type="button">Send code</button>
    </div>
    <div style="margin-top:8px;">
      <input id="otp" placeholder="Enter code from email" inputmode="numeric" autocomplete="one-time-code" />
    </div>
    <div id="authRow">
      <button id="verifyBtn" type="button">Verify</button>
      <button id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>

  <div class="total" id="todayTotal">Today: 00:00:00</div>

  <div class="controls">
    <input id="newItemName" placeholder="Add item (e.g., Arpeggios)" />
    <button id="addBtn" type="button">Add</button>
    <input id="manualMinutes" inputmode="decimal" placeholder="Minutes to add manually (e.g., 30)" />
  </div>

  <div id="items"></div>

  <div class="navLinks">
    <a href="#history" id="historyLink">History</a>
    <a href="#totals" id="totalsLink">Totals</a>
  </div>

  <div id="history" style="display:none;"></div>
  <div id="totals" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // =============================
    // 1) SUPABASE CONFIG
    // =============================
    const supabaseUrl = "https://pkzwwhaqnpxmzqwzcitl.supabase.co";
    const supabaseAnonKey = "sb_publishable_UPhipxgZU5lbyY3gAECheQ_xk1kdLjp";
    const sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

    // =============================
    // 2) HELPERS
    // =============================
    const statusEl = document.getElementById("status");
    const setStatus = (msg) => { statusEl.textContent = msg || ""; };

    const pad = (n) => String(n).padStart(2, "0");

    const fmt = (secs) => {
      secs = Math.max(0, Math.floor(Number(secs) || 0));
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    };

    const LONDON_TZ = "Europe/London";

    const londonDateKey = (tsMs) => {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: LONDON_TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date(tsMs));

      const get = (type) => parts.find(p => p.type === type).value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    };

    const todayKey = () => londonDateKey(Date.now());
    const dateKeyForTs = (tsMs) => londonDateKey(tsMs);
    const parseDateKey = (d) => String(d).slice(0, 10);

    function minutesToSeconds(mins) {
      const n = Number(String(mins).replace(",", "."));
      if (!Number.isFinite(n) || n < 0) return null;
      return Math.round(n * 60);
    }

    function daysBetweenDateKeysInclusive(startKey, endKey) {
      const start = new Date(`${startKey}T00:00:00`);
      const end = new Date(`${endKey}T00:00:00`);
      const diffMs = end - start;
      const diffDays = Math.floor(diffMs / 86400000);
      return Math.max(1, diffDays + 1);
    }

    function fmtHoursPerDay(secsPerDay) {
      const hours = secsPerDay / 3600;
      return `${hours.toFixed(2)} h/day`;
    }

    // =============================
    // 3) IN-MEMORY STATE
    // =============================
    let currentUserId = null;

    let items = [];        // { id, name, archived, createdAt }
    let dailyTotals = [];  // { userId, itemId, dateKey, totalSec }
    let running = null;    // { itemId, startTs } or null

    let historySelectedDate = null;

    // =============================
    // 4) AUTH UI + LOGIN FLOW
    // =============================
    const authBox = document.getElementById("authBox");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const sendCodeBtn = document.getElementById("sendCodeBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const signOutBtn = document.getElementById("signOutBtn");

    function showAuthBox(show) {
      authBox.style.display = show ? "block" : "none";
    }

    sendCodeBtn.onclick = async () => {
      try {
        const email = emailInput.value.trim();
        if (!email) return alert("Enter your email.");

        setStatus("Sending code...");

        const { error } = await sb.auth.signInWithOtp({ email });

        if (error) return alert(error.message);

        setStatus("Code sent. Check your email.");
      } catch (e) {
        alert(e?.message || String(e));
      }
    };

    verifyBtn.onclick = async () => {
      try {
        const email = emailInput.value.trim();
        const token = otpInput.value.trim();

        if (!email || !token) return alert("Enter email and code.");

        setStatus("Verifying...");

        const { error } = await sb.auth.verifyOtp({
          email,
          token,
          type: "email"
        });

        if (error) return alert(error.message);

        setStatus("Logged in.");
        await bootstrapAfterLogin();
      } catch (e) {
        alert(e?.message || String(e));
      }
    };

    signOutBtn.onclick = async () => {
      await sb.auth.signOut();

      currentUserId = null;
      items = [];
      dailyTotals = [];
      running = null;
      historySelectedDate = null;

      setStatus("Signed out.");
      showAuthBox(true);
      render();
    };

    async function getSessionUserId() {
      const { data: { session } } = await sb.auth.getSession();
      return session?.user?.id || null;
    }

    // =============================
    // 5) CLOUD LOAD/SAVE
    // =============================
    async function loadFromCloud() {
      if (!currentUserId) return;

      setStatus("Loading from cloud...");

      const { data: itemsData, error: itemsErr } = await sb
        .from("practice_items")
        .select("*")
        .eq("user_id", currentUserId)
        .order("created_at", { ascending: true });

      if (itemsErr) throw itemsErr;

      items = (itemsData || []).map(r => ({
        id: r.id,
        name: r.name,
        archived: !!r.archived,
        createdAt: new Date(r.created_at).getTime()
      }));

      const { data: totalsData, error: totalsErr } = await sb
        .from("practice_daily_totals")
        .select("*")
        .eq("user_id", currentUserId)
        .order("date_key", { ascending: false });

      if (totalsErr) throw totalsErr;

      dailyTotals = (totalsData || []).map(r => ({
        userId: r.user_id,
        itemId: r.item_id,
        dateKey: parseDateKey(r.date_key),
        totalSec: Number(r.total_seconds || 0)
      }));

      setStatus("");
    }

    function addToLocalDailyTotals(itemId, dateKey, durationSec) {
      const existing = dailyTotals.find(
        r => r.itemId === itemId && r.dateKey === dateKey
      );

      if (existing) {
        existing.totalSec += durationSec;
      } else {
        dailyTotals.push({
          userId: currentUserId,
          itemId,
          dateKey,
          totalSec: durationSec
        });
      }
    }

    async function addItemToCloud(name) {
      const { data, error } = await sb
        .from("practice_items")
        .insert({
          user_id: currentUserId,
          name,
          archived: false
        })
        .select()
        .single();

      if (error) throw error;

      items.push({
        id: data.id,
        name: data.name,
        archived: !!data.archived,
        createdAt: new Date(data.created_at).getTime()
      });
    }

    async function saveSessionToCloud(itemId, startTs, endTs, durationSec, dateKey) {
      const { data, error } = await sb
        .from("practice_sessions")
        .insert({
          user_id: currentUserId,
          item_id: itemId,
          start_time: new Date(startTs).toISOString(),
          end_time: new Date(endTs).toISOString(),
          duration_seconds: durationSec,
          date_key: dateKey
        })
        .select()
        .single();

      if (error) throw error;

      addToLocalDailyTotals(itemId, dateKey, durationSec);

      return data;
    }

    // =============================
    // 6) TOTALS
    // =============================
    function totalsForDate(dateKey) {
      const byItem = new Map();
      let total = 0;

      for (const row of dailyTotals) {
        if (row.dateKey !== dateKey) continue;

        const secs = Number(row.totalSec || 0);

        total += secs;
        byItem.set(row.itemId, (byItem.get(row.itemId) || 0) + secs);
      }

      if (running && dateKey === todayKey()) {
        const runningSecs = Math.floor((Date.now() - running.startTs) / 1000);
        total += runningSecs;
        byItem.set(
          running.itemId,
          (byItem.get(running.itemId) || 0) + runningSecs
        );
      }

      return { total, byItem };
    }

    function totalsForItemAllTime() {
      const byItem = new Map();
      const firstDate = new Map();

      for (const row of dailyTotals) {
        const secs = Number(row.totalSec || 0);

        byItem.set(row.itemId, (byItem.get(row.itemId) || 0) + secs);

        const existing = firstDate.get(row.itemId);
        if (!existing || row.dateKey < existing) {
          firstDate.set(row.itemId, row.dateKey);
        }
      }

      if (running) {
        const runningSecs = Math.floor((Date.now() - running.startTs) / 1000);
        const runningDate = dateKeyForTs(running.startTs);

        byItem.set(
          running.itemId,
          (byItem.get(running.itemId) || 0) + runningSecs
        );

        const existing = firstDate.get(running.itemId);
        if (!existing || runningDate < existing) {
          firstDate.set(running.itemId, runningDate);
        }
      }

      return { byItem, firstDate };
    }

    // =============================
    // 7) ADD TIME / TIMER
    // =============================
    async function addManualTime(itemId, minutes) {
      if (!currentUserId) return alert("Please log in first.");

      const durationSec = minutesToSeconds(minutes);
      if (durationSec === null) {
        return alert("Enter a valid number of minutes, e.g. 30.");
      }

      const endTs = Date.now();
      const startTs = endTs - durationSec * 1000;
      const dKey = dateKeyForTs(endTs);

      try {
        setStatus("Saving manual time...");
        await saveSessionToCloud(itemId, startTs, endTs, durationSec, dKey);
        setStatus("");
        render();
      } catch (e) {
        setStatus("");
        alert(e?.message || String(e));
      }
    }

    async function toggleTimerForItem(itemId) {
      if (!currentUserId) return alert("Please log in first.");

      if (!running) {
        running = { itemId, startTs: Date.now() };
        render();
        return;
      }

      if (running.itemId === itemId) {
        const startTs = running.startTs;
        const endTs = Date.now();
        const durationSec = Math.max(0, Math.floor((endTs - startTs) / 1000));
        const dKey = dateKeyForTs(endTs);

        running = null;
        render();

        try {
          setStatus("Saving session...");
          await saveSessionToCloud(itemId, startTs, endTs, durationSec, dKey);
          setStatus("");
          render();
        } catch (e) {
          setStatus("");
          alert(e?.message || String(e));
        }

        return;
      }

      const prev = running;
      const prevStartTs = prev.startTs;
      const prevEndTs = Date.now();
      const prevDur = Math.max(0, Math.floor((prevEndTs - prevStartTs) / 1000));
      const prevDateKey = dateKeyForTs(prevEndTs);

      running = { itemId, startTs: Date.now() };
      render();

      try {
        setStatus("Saving session...");
        await saveSessionToCloud(prev.itemId, prevStartTs, prevEndTs, prevDur, prevDateKey);
        setStatus("");
        render();
      } catch (e) {
        setStatus("");
        alert(e?.message || String(e));
      }
    }

    // =============================
    // 8) RENDERING
    // =============================
    function renderHome() {
      const date = todayKey();
      const { total, byItem } = totalsForDate(date);

      document.getElementById("todayTotal").textContent = `Today: ${fmt(total)}`;

      const wrap = document.getElementById("items");
      wrap.innerHTML = "";

      for (const it of items.filter(x => !x.archived)) {
        const row = document.createElement("div");
        row.className = "row";

        const isRunning = running && running.itemId === it.id;
        if (isRunning) row.classList.add("running");

        const left = document.createElement("div");
        left.className = "name";
        left.textContent = it.name;
        left.onclick = (ev) => {
          ev.stopPropagation();
          toggleTimerForItem(it.id);
        };

        const timeEl = document.createElement("div");
        timeEl.className = "time";
        timeEl.textContent = fmt(byItem.get(it.id) || 0);

        const rightWrap = document.createElement("div");
        rightWrap.className = "rightWrap";

        const addTimeBtn = document.createElement("button");
        addTimeBtn.type = "button";
        addTimeBtn.textContent = "+ Add time";
        addTimeBtn.onclick = async (ev) => {
          ev.stopPropagation();
          const mins = document.getElementById("manualMinutes").value.trim();
          await addManualTime(it.id, mins);
        };

        rightWrap.appendChild(timeEl);
        rightWrap.appendChild(addTimeBtn);

        row.appendChild(left);
        row.appendChild(rightWrap);
        wrap.appendChild(row);
      }
    }

    function renderHistory() {
      const hist = document.getElementById("history");
      hist.innerHTML = "<h2>History</h2>";

      const dates = Array.from(new Set(dailyTotals.map(r => r.dateKey)))
        .sort()
        .reverse();

      if (dates.length === 0) {
        hist.innerHTML += "<p>No sessions yet.</p>";
        return;
      }

      if (!historySelectedDate || !dates.includes(historySelectedDate)) {
        historySelectedDate = dates[0];
      }

      for (const d of dates) {
        const { total } = totalsForDate(d);

        const div = document.createElement("div");
        div.className = "row";
        if (d === historySelectedDate) div.classList.add("running");

        const left = document.createElement("div");
        left.className = "name";
        left.textContent = d;

        const right = document.createElement("div");
        right.className = "time";
        right.textContent = fmt(total);

        div.appendChild(left);
        div.appendChild(right);

        div.onclick = () => {
          historySelectedDate = d;
          render();
        };

        hist.appendChild(div);
      }

      const h3 = document.createElement("h3");
      h3.textContent = `Totals for ${historySelectedDate}`;
      h3.style.marginTop = "16px";
      hist.appendChild(h3);

      const rows = dailyTotals
        .filter(r => r.dateKey === historySelectedDate)
        .slice()
        .sort((a, b) => b.totalSec - a.totalSec);

      for (const r of rows) {
        const it = items.find(x => x.id === r.itemId);
        const itemName = it ? it.name : "(Unknown item)";

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        left.className = "name";
        left.textContent = itemName;

        const right = document.createElement("div");
        right.className = "time";
        right.textContent = fmt(r.totalSec || 0);

        row.appendChild(left);
        row.appendChild(right);

        hist.appendChild(row);
      }
    }

    function renderTotals() {
      const totalsEl = document.getElementById("totals");
      const { byItem, firstDate } = totalsForItemAllTime();
      const today = todayKey();

      const rows = items
        .filter(x => !x.archived)
        .map(it => {
          const totalSec = byItem.get(it.id) || 0;
          const startDate = firstDate.get(it.id) || null;
          const days = startDate ? daysBetweenDateKeysInclusive(startDate, today) : 0;
          const avgSecPerDay = days > 0 ? totalSec / days : 0;

          return {
            item: it,
            totalSec,
            firstDate: startDate,
            days,
            avgSecPerDay
          };
        })
        .sort((a, b) => b.totalSec - a.totalSec);

      const grandTotal = rows.reduce((sum, r) => sum + r.totalSec, 0);

      totalsEl.innerHTML = `<h2>Totals</h2><div class="total">All time: ${fmt(grandTotal)}</div>`;

      if (rows.length === 0) {
        totalsEl.innerHTML += "<p>No items yet.</p>";
        return;
      }

      for (const rowData of rows) {
        const row = document.createElement("div");
        row.className = "row";

        const leftWrap = document.createElement("div");
        leftWrap.style.display = "flex";
        leftWrap.style.flexDirection = "column";
        leftWrap.style.gap = "4px";

        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = rowData.item.name;

        const subEl = document.createElement("div");
        subEl.className = "subtle";
        subEl.textContent = rowData.firstDate
          ? `Since ${rowData.firstDate} • Avg ${fmtHoursPerDay(rowData.avgSecPerDay)}`
          : "No sessions yet";

        const rightWrap = document.createElement("div");
        rightWrap.style.display = "flex";
        rightWrap.style.flexDirection = "column";
        rightWrap.style.alignItems = "flex-end";
        rightWrap.style.gap = "4px";

        const totalEl = document.createElement("div");
        totalEl.className = "time";
        totalEl.textContent = fmt(rowData.totalSec);

        const avgEl = document.createElement("div");
        avgEl.className = "subtle";
        avgEl.textContent = rowData.days > 0
          ? `${rowData.days} day${rowData.days === 1 ? "" : "s"}`
          : "";

        rightWrap.appendChild(totalEl);
        rightWrap.appendChild(avgEl);

        leftWrap.appendChild(nameEl);
        leftWrap.appendChild(subEl);

        row.appendChild(leftWrap);
        row.appendChild(rightWrap);

        totalsEl.appendChild(row);
      }
    }

    function render() {
      const isHistory = location.hash === "#history";
      const isTotals = location.hash === "#totals";
      const isHome = !isHistory && !isTotals;

      document.getElementById("history").style.display = isHistory ? "block" : "none";
      document.getElementById("totals").style.display = isTotals ? "block" : "none";
      document.getElementById("items").style.display = isHome ? "block" : "none";
      document.getElementById("todayTotal").style.display = isHome ? "block" : "none";
      document.querySelector(".controls").style.display = isHome ? "flex" : "none";

      if (isHistory) renderHistory();
      else if (isTotals) renderTotals();
      else renderHome();
    }

    // =============================
    // 9) UI EVENTS
    // =============================
    document.getElementById("addBtn").onclick = async () => {
      try {
        if (!currentUserId) return alert("Please log in first.");

        const input = document.getElementById("newItemName");
        const name = input.value.trim();

        if (!name) return;

        setStatus("Saving item...");
        await addItemToCloud(name);
        setStatus("");

        input.value = "";
        render();
      } catch (e) {
        setStatus("");
        alert(e?.message || String(e));
      }
    };

    document.getElementById("manualMinutes").addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      if (!running) return;

      const mins = e.target.value.trim();
      await addManualTime(running.itemId, mins);
    });

    // =============================
    // 10) STARTUP / BOOTSTRAP
    // =============================
    window.addEventListener("hashchange", render);

    setInterval(() => {
      if (running) render();
    }, 1000);

    async function bootstrapAfterLogin() {
      currentUserId = await getSessionUserId();

      if (!currentUserId) {
        showAuthBox(true);
        return;
      }

      showAuthBox(false);
      await loadFromCloud();
      render();
    }

    (async () => {
      currentUserId = await getSessionUserId();

      if (!currentUserId) {
        showAuthBox(true);
        setStatus("Please log in.");
        render();
        return;
      }

      showAuthBox(false);
      await loadFromCloud();
      render();
    })();
  </script>
</body>
</html>
